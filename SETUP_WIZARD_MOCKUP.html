<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cleaning Planner — setup wizard mockup v4</title>
<style>
  :root {
    --bg:#f5f5f5; --card:#fff; --text:#171717; --muted:#a3a3a3; --muted2:#737373;
    --band:#ececec; --ring:rgba(0,0,0,.07); --inv:#171717; --invtext:#fff;
    --good:#5ea02e; --soso:#e0a500; --ugly:#e24b4a;
  }
  .dark {
    --bg:#0a0a0a; --card:#171717; --text:#f5f5f5; --muted:#737373; --muted2:#a3a3a3;
    --band:#262626; --ring:rgba(255,255,255,.12); --inv:#f5f5f5; --invtext:#171717;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { margin:0; background:#d4d4d4; display:flex; justify-content:center; padding:24px 8px; }
  .phone { width:390px; max-width:100%; height:800px; background:var(--bg); border-radius:28px; overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,.35); border:1px solid rgba(0,0,0,.2); display:flex; flex-direction:column; }
  header { background:color-mix(in srgb,var(--card) 90%,transparent); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--ring); padding:12px 16px; display:flex; align-items:center; gap:8px; flex-shrink:0; }
  header .back { border:none; background:none; color:var(--muted2); font-size:22px; cursor:pointer; padding:0 6px; visibility:hidden; line-height:1; }
  header .back.show { visibility:visible; }
  header h1 { font-size:15px; font-weight:600; color:var(--text); margin:0; flex:1; }
  .toggle-dark { font-size:11px; color:var(--muted2); background:var(--band); border:none; border-radius:6px; padding:5px 8px; cursor:pointer; }
  .scroll { flex:1; overflow-y:auto; padding:20px 18px 24px; display:flex; flex-direction:column; }
  h2 { font-size:20px; font-weight:700; color:var(--text); margin:2px 0 5px; }
  .sub { font-size:13px; color:var(--muted2); margin:0 0 16px; line-height:1.45; }
  svg.i { width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-0.12em; }
  .ico { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }

  /* room-select rows */
  .rrow { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--ring);
    border-radius:12px; padding:13px 14px; margin-bottom:8px; cursor:pointer; }
  .rrow .nm { flex:1; font-size:15px; font-weight:600; color:var(--text); }
  .rrow .ric { color:var(--muted2); display:flex; }
  .sw { width:44px; height:26px; border-radius:13px; background:var(--band); position:relative; flex-shrink:0; }
  .rrow.on .sw { background:var(--good); }
  .sw::after { content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
    background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .rrow.on .sw::after { left:21px; }
  .xbtn { width:28px; height:28px; border-radius:8px; border:1px solid var(--ring); background:var(--bg);
    color:var(--muted2); font-size:15px; line-height:1; cursor:pointer; flex-shrink:0; }

  .addwrap { background:var(--card); border:1px solid var(--ring); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .addwrap .lbl { font-size:12px; font-weight:600; color:var(--muted2); margin-bottom:6px; }
  .addrow { display:flex; gap:8px; align-items:center; }
  .wheelbox { flex:1; position:relative; height:40px; overflow:hidden; border-radius:9px; background:var(--band); }
  .wband { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:96px; height:32px; border-radius:7px; background:var(--card); pointer-events:none; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .wheel { position:relative; display:flex; height:100%; overflow-x:scroll; scroll-snap-type:x mandatory; scrollbar-width:none; align-items:center; }
  .wheel::-webkit-scrollbar { display:none; }
  .wsp { flex-shrink:0; width:calc(50% - 48px); }
  .wv { flex-shrink:0; width:96px; scroll-snap-align:center; text-align:center; font-size:13px; font-weight:500; color:var(--muted); white-space:nowrap; }
  .wv.sel { font-size:14px; font-weight:700; color:var(--text); }
  .addbtn { flex-shrink:0; border:1px solid var(--ring); background:var(--card); color:var(--text); border-radius:9px;
    width:40px; height:40px; font-size:20px; cursor:pointer; }

  .done-row { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--ring);
    border-radius:10px; padding:9px 12px; margin-bottom:6px; cursor:pointer; }
  .done-row .k { font-size:12px; font-weight:600; color:var(--muted); width:66px; flex-shrink:0; }
  .done-row .v { flex:1; font-size:13.5px; font-weight:600; color:var(--text); }
  .done-row .edit { color:var(--muted); font-size:12px; }
  .done-row.task .v small { color:var(--muted); font-weight:500; margin-left:6px; font-size:11.5px; }
  .st.g { color:var(--good); } .st.b { color:var(--soso); } .st.u { color:var(--ugly); }

  .q { background:var(--card); border:1px solid var(--ring); border-radius:14px; padding:16px; margin-top:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.05); }
  .q h3 { margin:0 0 12px; font-size:16px; font-weight:700; color:var(--text); }
  .optrow { display:flex; gap:7px; flex-wrap:wrap; }
  .opt { border:1px solid var(--ring); background:var(--bg); color:var(--text); border-radius:10px; padding:10px 13px;
    font-size:13.5px; font-weight:600; cursor:pointer; }
  .opt small { display:block; font-size:10.5px; font-weight:400; color:var(--muted); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .tile2 { border:1px solid var(--ring); background:var(--bg); border-radius:11px; padding:12px 8px; text-align:center; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:5px; }
  .tile2 .ico { width:22px; height:22px; color:var(--muted2); }
  .tile2 .l { font-size:12.5px; font-weight:600; color:var(--text); }
  .tile2.on { background:var(--inv); border-color:var(--inv); }
  .tile2.on .l, .tile2.on .ico { color:var(--invtext); }
  .tile2.addt { border-style:dashed; }
  .qcta { margin-top:12px; width:100%; border:none; border-radius:10px; padding:12px 0; font-size:14px; font-weight:600;
    background:var(--inv); color:var(--invtext); cursor:pointer; }
  .inlineadd { display:flex; gap:7px; margin-top:9px; }
  .inlineadd input { flex:1; border:1px solid var(--ring); background:var(--bg); color:var(--text); border-radius:9px;
    padding:9px 11px; font-size:13.5px; outline:none; }
  .inlineadd button { border:none; background:var(--inv); color:var(--invtext); border-radius:9px; padding:0 16px; font-size:13px; font-weight:600; cursor:pointer; }

  .tname { font-size:17px; font-weight:700; color:var(--text); }
  .test { font-size:12px; color:var(--muted); margin:2px 0 12px; }
  .flabel { font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:12px 0 6px; }
  .freq { display:flex; align-items:center; gap:10px; background:var(--bg); border-radius:10px; padding:6px; }
  .freq button { width:36px; height:36px; border-radius:8px; border:1px solid var(--ring); background:var(--card); color:var(--text); font-size:18px; cursor:pointer; line-height:1; }
  .freq .fv { flex:1; text-align:center; font-size:14.5px; font-weight:700; color:var(--text); }
  .freq .fv small { display:block; font-size:10.5px; color:var(--muted); font-weight:500; }
  .freq .fv .chg { display:block; color:var(--soso); font-size:10.5px; font-weight:600; }
  .gbu { display:flex; gap:6px; }
  .gbu button { flex:1; border:1px solid var(--ring); background:var(--bg); border-radius:9px; padding:9px 0;
    font-size:11.5px; font-weight:600; color:var(--muted2); cursor:pointer; }
  .gbu button .em { display:block; font-size:15px; margin-bottom:2px; }
  .gbu button.g.on { background:color-mix(in srgb,var(--good) 14%,var(--card)); border-color:var(--good); color:var(--good); }
  .gbu button.b.on { background:color-mix(in srgb,var(--soso) 14%,var(--card)); border-color:var(--soso); color:#8a6500; }
  .gbu button.u.on { background:color-mix(in srgb,var(--ugly) 14%,var(--card)); border-color:var(--ugly); color:var(--ugly); }
  .pair { display:flex; gap:8px; margin-top:14px; }
  .pair button { flex:1; border-radius:10px; padding:12px 0; font-size:14px; font-weight:600; cursor:pointer; }
  .pair .ghost { background:var(--card); color:var(--muted2); border:1px solid var(--ring); }
  .pair .solid { background:var(--inv); color:var(--invtext); border:none; }
  input.tin { width:100%; border:1px solid var(--ring); background:var(--bg); color:var(--text); border-radius:10px;
    padding:11px 12px; font-size:14.5px; font-weight:500; outline:none; }

  .cta { display:block; width:100%; border:none; border-radius:11px; padding:14px 0; font-size:15px; font-weight:600;
    background:var(--inv); color:var(--invtext); cursor:pointer; margin-top:16px; flex-shrink:0; }
  .cta.ghost { background:var(--card); color:var(--text); border:1px solid var(--ring); }
  .cta:disabled { opacity:.4; }

  .ovroom { background:var(--card); border:1px solid var(--ring); border-radius:13px; padding:13px 14px; margin-bottom:9px; }
  .ovroom .hd { display:flex; align-items:center; gap:10px; }
  .ovroom .hd .ric { color:var(--muted2); display:flex; }
  .ovroom .hd .nm { flex:1; font-size:15px; font-weight:700; color:var(--text); }
  .ovroom .hd .n { font-size:12px; color:var(--muted); }
  .ovroom .set { font-size:12px; color:var(--muted2); margin-top:4px; cursor:pointer; }
  .ovroom .set u { text-decoration:none; border-bottom:1px dotted var(--muted); }
  .ovtasks { margin-top:8px; border-top:1px solid var(--ring); padding-top:7px; display:none; }
  .ovroom.exp .ovtasks { display:block; }
  .ovtasks div { display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted2); padding:4px 0; }
  .ovtasks div b { color:var(--text); font-weight:500; }
  .gearnote { display:flex; gap:10px; align-items:center; background:var(--band); border-radius:11px; padding:11px 13px;
    font-size:12.5px; color:var(--muted2); margin-top:14px; line-height:1.4; }

  .ptile { background:var(--card); border-radius:12px; box-shadow:0 1px 2px rgba(0,0,0,.06); padding:10px 12px; margin-bottom:9px; }
  .ptile .r1 { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .ptile .n { font-size:14px; font-weight:500; color:var(--text); }
  .ptile .n small { font-size:11px; color:var(--muted); font-weight:400; margin-left:6px; }
  .ptile .d { font-size:11.5px; font-weight:600; }
  .ptile svg.bar { display:block; width:100%; margin-top:7px; }
  .axis { position:relative; height:14px; margin:0 12px 8px; font-size:10.5px; font-weight:500; color:var(--muted); flex-shrink:0; }
  .axis span { position:absolute; transform:translateX(-50%); }
  .axis span:first-child { transform:none; }
</style>
</head>
<body>
<div class="phone" id="phone">
  <header>
    <button class="back" id="backBtn" onclick="goBack()">‹</button>
    <h1 id="title">Set up your home</h1>
    <button class="toggle-dark" onclick="document.getElementById('phone').classList.toggle('dark')">◐</button>
  </header>
  <div class="scroll" id="scr"></div>
</div>

<script>
// ============ monochrome line icons (match app aesthetic) ===================
const P = {
  kitchen:'<path d="M3 11h18"/><path d="M20 11v6a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-6"/><path d="m5 7.5 14-3.5"/>',
  bathroom:'<path d="M3 12h18"/><path d="M20 12v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-3"/><path d="M7 19v2M17 19v2"/><path d="M5 12V5a2 2 0 0 1 4 0"/>',
  hallway:'<path d="M4 21h16"/><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/><path d="M14.5 12h.01"/>',
  bedroom:'<path d="M3 19v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6"/><path d="M3 16h18"/><path d="M5 11V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v5"/>',
  'living-room':'<path d="M20 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v3"/><path d="M2 11v5a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v2H6v-2a2 2 0 0 0-4 0Z"/><path d="M4 18v2M20 18v2"/>',
  office:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
  balcony:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4 7 17M17 7l1.4-1.4"/>',
  other:'<path d="M21 8v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8"/><rect x="2" y="4" width="20" height="4" rx="1"/><path d="M10 12h4"/>',
  oven:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M7 6.5h.01M10 6.5h.01"/><rect x="7" y="12" width="10" height="5" rx="1"/>',
  fridge:'<path d="M5 4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M5 9h14"/><path d="M8 6h.01M8 12v3"/>',
  dishwasher:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 8h16"/><path d="M8 5.5h.01"/><path d="M9 13a3 3 0 0 0 6 0"/><path d="M12 13v4"/>',
  microwave:'<rect x="2" y="5" width="20" height="14" rx="2"/><rect x="5" y="8" width="9" height="8" rx="1"/><path d="M18 8v8"/>',
  hood:'<path d="M4 13h16l-4-6H8z"/><path d="M12 3v4"/><path d="M8 17h.01M12 18h.01M16 17h.01"/>',
  plants:'<path d="M7 21h10"/><path d="M12 21c0-4 0-6.5 2.5-9.5"/><path d="M12 15c0-3-1.5-5-4.5-5.8C5 8.6 3.6 9.3 3 10c1 2.6 2.6 4.4 6 4.7z"/><path d="M14.5 11.5c.6-2.5 2-4 4.5-4.7 1.5-.4 2.6 0 3 .4-.8 2.6-2.5 4.3-5.5 4.6z"/>',

  washer:'<rect x="4" y="2" width="16" height="20" rx="2"/><circle cx="12" cy="13" r="4.5"/><path d="M8 5h.01M11 5h2"/>',
  dryer:'<rect x="4" y="2" width="16" height="20" rx="2"/><circle cx="12" cy="13" r="4.5"/><path d="M9.8 13a2.2 2.2 0 0 0 4.4 0"/><path d="M8 5h.01"/>',
  bed:'<path d="M3 19v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6"/><path d="M3 16h18"/><path d="M5 11V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v5"/>',
  wardrobe:'<rect x="4" y="2" width="16" height="19" rx="2"/><path d="M12 2v19"/><path d="M10 10v2.5M14 10v2.5"/><path d="M7 21v1.5M17 21v1.5"/>',
  desk:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
  mirror:'<ellipse cx="12" cy="9.5" rx="5.5" ry="7.5"/><path d="M12 17v4M9 21h6"/>',
  tv:'<path d="m17 2-5 5-5-5"/><rect x="2" y="7" width="20" height="14" rx="2"/>',
  shelf:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5z"/><path d="M20 17v5H6.5a2.5 2.5 0 0 1-1.7-.7"/>',
  table:'<path d="M3 8h18"/><path d="M5 8v10M19 8v10"/><path d="m3 8 2-3h14l2 3"/>',
  doormat:'<rect x="3" y="9" width="18" height="7" rx="1"/><path d="M6 11.5v2M9 11.5v2M12 11.5v2M15 11.5v2M18 11.5v2"/>',
  grill:'<path d="M6 8a6 6 0 0 0 12 0z"/><path d="M12 14v3"/><path d="m8.5 21 1.2-4M15.5 21l-1.2-4"/>',
  chair:'<path d="M5 11V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v6"/><path d="M4 19h16v-4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2z"/><path d="M6 19v2M18 19v2"/>',

const ico = (k,cls='ico') => `<svg class="${cls}" viewBox="0 0 24 24">${P[k]||P.other}</svg>`;
const I_SPARK=`<svg class="i" viewBox="0 0 24 24">${P.spark}</svg>`;
const I_HALF='<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>';
const I_ALERT='<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16.5" x2="12.01" y2="16.5"/></svg>';
const ST_ICON={g:I_SPARK,b:I_HALF,u:I_ALERT};
const CHECKSVG='<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';

// ============ RESEARCHED library ============================================
// Frequencies grounded in published cleaning-schedule guidance (Tidywell,
// HousewifeHowTos, NBC/science roundups). Only tasks that DON'T announce
// themselves — no trash, no dishes, no visible-mess tidying.
const FLOOR_TASKS = {
  hard:[{n:'Vacuum / sweep floor',f:7,d:15,pets:true,sizeScale:true},{n:'Mop floor',f:14,d:15,sizeScale:true}],

};

  bathroom:{floorMop7:true, base:[

      {n:'Clean sink & mirror',f:7,d:10},
      {n:'Swap towels',f:4,d:5},
      {n:'Wash bath mat',f:14,d:5},
      {n:'Descale taps & showerhead',f:30,d:15}],
    equipment:[
      ['shower','shower','Shower',[{n:'Scrub shower & glass',f:7,d:15},{n:'Wash shower curtain',f:90,d:10}]],
      ['bathtub','bathtub','Bathtub',[{n:'Scrub bathtub',f:7,d:15}]],
      ['washer','washer','Washing machine',[{n:'Washer care cycle & seal',f:30,d:10}]],
      ['dryer','dryer','Dryer',[{n:'Clear dryer lint & vent',f:90,d:10}]],
      ['plants','plants','Plants',[{n:'Water plants',f:7,d:5}]]]},
  bedroom:{base:[
      {n:'Dust surfaces',f:7,d:10}],
    windowsCurtains:true,
    equipment:[
      ['bed','bed','Bed',[{n:'Change bed sheets',f:7,d:15},{n:'Rotate & vacuum mattress',f:120,d:20},{n:'Wash duvet & pillows',f:120,d:15}]],
      ['wardrobe','wardrobe','Wardrobe',[{n:'Declutter wardrobe',f:180,d:30}]],
      ['desk','desk','Desk',[{n:'Wipe desk & tech',f:7,d:5}]],
      ['mirror','mirror','Mirror',[{n:'Wipe mirror',f:14,d:5}]],
      ['tv','tv','TV / electronics',[{n:'Dust electronics & cables',f:14,d:5}]],
      ['plants','plants','Plants',[{n:'Water plants',f:4,d:5}]]]},
  'living-room':{base:[
      {n:'Dust surfaces & shelves',f:7,d:15},
      {n:'Wipe remotes, switches & handles',f:7,d:5}],
    windowsCurtains:true,
    equipment:[
      ['sofa','living-room','Sofa',[{n:'Vacuum sofa & under cushions',f:30,d:15,pets:true},{n:'Wash throws & cushion covers',f:30,d:10}]],
      ['tv','tv','TV / electronics',[{n:'Dust TV & electronics',f:14,d:5}]],
      ['table','table','Dining table',[{n:'Polish table & chairs',f:30,d:10}]],
      ['shelf','shelf','Bookshelf',[{n:'Dust bookshelf & books',f:30,d:10}]],
      ['plants','plants','Plants',[{n:'Water plants',f:4,d:5}]]]},
  hallway:{base:[
      {n:'Wipe handles, switches & rails',f:7,d:5}],
    equipment:[
      ['doormat','doormat','Doormat',[{n:'Shake out doormat',f:7,d:5}]],
      ['mirror','mirror','Mirror',[{n:'Wipe mirror',f:14,d:5}]],
      ['wardrobe','wardrobe','Coat closet',[{n:'Declutter coat closet',f:180,d:20}]]]},
  office:{base:[
      {n:'Dust surfaces',f:7,d:10}],
    windowsCurtains:true,
    equipment:[
      ['desk','desk','Desk & screens',[{n:'Wipe desk, keyboard & screen',f:7,d:10}]],
      ['shelf','shelf','Bookshelf',[{n:'Dust bookshelf',f:30,d:10}]],
      ['plants','plants','Plants',[{n:'Water plants',f:4,d:5}]]]},
  balcony:{noFloor:true, base:[
      {n:'Sweep floor',f:14,d:10,sizeScale:true}],
    equipment:[
      ['chair','chair','Outdoor furniture',[{n:'Wipe outdoor furniture',f:30,d:10}]],
      ['plants','plants','Plants',[{n:'Water plants',f:3,d:5}]],
      ['grill','grill','Grill',[{n:'Deep clean grill',f:90,d:30}]]]},
  other:{base:[
      {n:'Dust surfaces',f:14,d:10}],
    equipment:[
      ['plants','plants','Plants',[{n:'Water plants',f:4,d:5}]],
      ['mirror','mirror','Mirror / glass',[{n:'Wipe glass',f:14,d:5}]]]},
};
const TYPE_META={kitchen:'Kitchen',bathroom:'Bathroom',hallway:'Hallway',bedroom:'Bedroom','living-room':'Living room',office:'Office',balcony:'Balcony',other:'Other'};
const DEFAULT_ROOMS=['kitchen','bathroom','hallway','bedroom','living-room'];
const WHEEL_TYPES=['bedroom','bathroom','kitchen','living-room','hallway','office','balcony','other'];
const SIZES=[['S','Small','< 10 m²',.7],['M','Medium','10–20 m²',1],['L','Large','> 20 m²',1.4]];
const WINDOWS=[['0','None',0],['1','1 window',10],['2','2 windows',15],['3','3 or more',25]];
const FLOORS=[['hard','Hard floor','wood, tile, laminate'],['carpet','Carpet','wall-to-wall'],['mixed','Hard + rugs','the mixed classic']];
const FREQ_STEPS=[1,2,3,4,5,7,10,14,21,30,45,60,90,120,180];
const fmtFreq=f=>({1:'every day',7:'every week',14:'every 2 weeks',21:'every 3 weeks',30:'every month',60:'every 2 months',90:'every 3 months',120:'every 4 months',180:'every 6 months'})[f]||`every ${f} days`;

// ============ state ==========================================================
const state={profile:{pets:true,plants:true,wfh:false},screen:'roomselect',
  sel:Object.fromEntries(DEFAULT_ROOMS.map(k=>[k,true])), extra:[], rooms:[], cur:0,
  cfgStep:0, ti:0, wheelIdx:0, history:[], showEquipAdd:false, ownF:7};
const scr=document.getElementById('scr'), title=document.getElementById('title'), backBtn=document.getElementById('backBtn');
function go(s,push=true){ state.screen=s; render(); }
// Structured back navigation: every wizard screen can step backwards —
// task by task, config question by question, room by room, out to selection.
function goBack(){
  const s=state.screen;
  if(s==='config'){
    if(state.cfgStep>0){ state.cfgStep--; render(); }
    else if(state.cur>0){ state.cur--; state.ti=state.rooms[state.cur].tasks.length; go('tasks'); }
    else go('roomselect');
  } else if(s==='tasks'){
    if(state.ti>0){ state.ti--; render(); }
    else { state.cfgStep=cfgSteps(state.rooms[state.cur]).length-1; go('config'); }
  } else if(s==='overview'){
    state.cur=state.rooms.length-1; state.ti=state.rooms[state.cur].tasks.length; go('tasks');
  }
}
function render(){
  backBtn.classList.toggle('show', ['config','tasks','overview'].includes(state.screen));
  scr.scrollTop=0;
  ({roomselect:rSelect,config:rConfig,tasks:rTasks,overview:rOverview,done:rDone})[state.screen]();
}

// ============ room selection =================================================
function rSelect(){
  title.textContent='Set up your home';
  const count=DEFAULT_ROOMS.filter(k=>state.sel[k]).length+state.extra.length;
  scr.innerHTML=`
    <h2>Which rooms do you have?</h2>
    <p class="sub">Toggle what applies — we'll set them up one by one afterwards.</p>
    ${DEFAULT_ROOMS.map(k=>`<div class="rrow ${state.sel[k]?'on':''}" onclick="state.sel['${k}']=!state.sel['${k}'];render()">
        <span class="ric">${ico(k)}</span><span class="nm">${TYPE_META[k]}</span><span class="sw"></span></div>`).join('')}
    ${state.extra.map((e,i)=>`<div class="rrow on">
        <span class="ric">${ico(e.type)}</span><span class="nm">${e.label}</span>
        <button class="xbtn" onclick="state.extra.splice(${i},1);render()">✕</button></div>`).join('')}
    <div class="addwrap">
      <div class="lbl">Add another room</div>
      <div class="addrow">
        <div class="wheelbox"><div class="wband"></div>
          <div class="wheel" id="typewheel"><div class="wsp"></div>
            ${WHEEL_TYPES.map((t,i)=>`<div class="wv ${i===state.wheelIdx?'sel':''}" data-i="${i}">${TYPE_META[t]}</div>`).join('')}
          <div class="wsp"></div></div>
        </div>
        <button class="addbtn" onclick="addExtra()">+</button>
      </div>
    </div>
    <button class="cta" ${count?'':'disabled'} onclick="buildRoomList()">Continue with ${count} room${count===1?'':'s'}</button>`;
  const wh=document.getElementById('typewheel'), W=96;
  wh.scrollLeft=state.wheelIdx*W;
  requestAnimationFrame(()=>{wh.scrollLeft=state.wheelIdx*W;});
  wh.addEventListener('scroll',()=>{
    const idx=Math.min(WHEEL_TYPES.length-1,Math.max(0,Math.round(wh.scrollLeft/W)));
    if(idx!==state.wheelIdx){ state.wheelIdx=idx;
      wh.querySelectorAll('.wv').forEach(el=>el.classList.toggle('sel',+el.dataset.i===idx)); }
  },{passive:true});
}
function addExtra(){
  const t=WHEEL_TYPES[state.wheelIdx];
  const n=(DEFAULT_ROOMS.includes(t)&&state.sel[t]?1:0)+state.extra.filter(e=>e.type===t).length;
  state.extra.push({type:t,label:n?`${TYPE_META[t]} ${n+1}`:TYPE_META[t]});
  render();
}
function buildRoomList(){
  state.rooms=[
    ...DEFAULT_ROOMS.filter(k=>state.sel[k]).map(k=>({type:k,name:TYPE_META[k]})),
    ...state.extra.map(e=>({type:e.type,name:e.label})),
  ].map(r=>({...r,size:null,windows:null,floor:LIB[r.type].noFloor?'hard':null,equip:[],custom:[],tasks:[]}));
  state.cur=0; state.cfgStep=0; state.history=[];
  go('config',false);
}

// ============ per-room config accordion =====================================
function cfgSteps(r){ return LIB[r.type].noFloor?['size','windows','equipment']:['size','windows','floor','equipment']; }
function rConfig(){
  const r=state.rooms[state.cur], steps=cfgSteps(r);
  title.textContent=`${r.name} · ${state.cur+1}/${state.rooms.length}`;
  const compact=steps.slice(0,state.cfgStep).map(s=>{
    const v=s==='size'?SIZES.find(x=>x[0]===r.size)?.slice(1,3).join(' · ')
      :s==='windows'?WINDOWS.find(x=>x[0]===r.windows)?.[1]
      :s==='floor'?FLOORS.find(x=>x[0]===r.floor)?.[1]
      :(r.equip.length||r.custom.length)?[...r.equip.map(k=>LIB[r.type].equipment.find(e=>e[0]===k)?.[2]),...r.custom.map(c=>c.name)].join(', '):'Empty';
    return `<div class="done-row" onclick="reopen('${s}')"><span class="k">${{size:'Size',windows:'Windows',floor:'Floor',equipment:'Inside'}[s]}</span><span class="v">${v}</span><span class="edit">edit</span></div>`;
  }).join('');
  const cur=steps[state.cfgStep];
  let q='';
  if(cur==='size') q=`<div class="q"><h3>How big is ${r.name}?</h3><div class="optrow">
      ${SIZES.map(([k,l,range])=>`<button class="opt" onclick="ans('size','${k}')">${l}<small>${range}</small></button>`).join('')}</div></div>`;
  if(cur==='windows') q=`<div class="q"><h3>Windows?</h3><div class="optrow">
      ${WINDOWS.map(([k,l])=>`<button class="opt" onclick="ans('windows','${k}')">${l}</button>`).join('')}</div></div>`;
  if(cur==='floor') q=`<div class="q"><h3>What's on the floor?</h3><div class="optrow">
      ${FLOORS.map(([k,l,d])=>`<button class="opt" onclick="ans('floor','${k}')">${l}<small>${d}</small></button>`).join('')}</div></div>`;
  if(cur==='equipment') q=`<div class="q"><h3>What's in here?</h3><div class="grid2">
      ${LIB[r.type].equipment.map(([k,icn,l])=>`<button class="tile2 ${r.equip.includes(k)?'on':''}" onclick="tglEquip('${k}')">${ico(icn)}<span class="l">${l}</span></button>`).join('')}
      ${r.custom.map((c,i)=>`<button class="tile2 on" onclick="state.rooms[state.cur].custom.splice(${i},1);render()">${ico('spark')}<span class="l">${c.name}</span></button>`).join('')}
      <button class="tile2 addt" onclick="state.showEquipAdd=!state.showEquipAdd;render()">${ico('plus')}<span class="l">Add</span></button>
      </div>
      ${state.showEquipAdd?`<div class="inlineadd"><input id="eqName" placeholder="e.g. Aquarium, piano…"><button onclick="addEquip()">Add</button></div>`:''}
      <button class="qcta" onclick="confirmEquip()">${(r.equip.length||r.custom.length)?'Continue':'Empty — continue'}</button></div>`;
  scr.innerHTML=`${compact}${q}`;
}
function ans(k,v){ const r=state.rooms[state.cur]; r[k]=v;
  const steps=cfgSteps(r);
  let nxt=steps.length-1;
  for(let i=0;i<steps.length;i++){ const s=steps[i]; if(s!=='equipment'&&r[s]===null){ nxt=i; break; } }
  state.cfgStep=nxt; render();
}
function reopen(s){ state.cfgStep=cfgSteps(state.rooms[state.cur]).indexOf(s); render(); }
function tglEquip(k){ const a=state.rooms[state.cur].equip; a.includes(k)?a.splice(a.indexOf(k),1):a.push(k); render(); }
function addEquip(){ const v=document.getElementById('eqName').value.trim(); if(!v)return;
  state.rooms[state.cur].custom.push({name:v}); state.showEquipAdd=false; render(); }
function confirmEquip(){ state.showEquipAdd=false; buildTasks(state.rooms[state.cur]); state.ti=0; go('tasks'); }

// ============ task build + selection ========================================
function buildTasks(r){
  const p=state.profile, lib=LIB[r.type], sizeF=SIZES.find(s=>s[0]===r.size)[3];
  const out=[];
  const add=t=>{ let f=t.f,d=t.d;
    if(t.pets&&p.pets)f=Math.max(1,Math.round(f/2));
    if(t.sizeScale)d=Math.max(5,Math.round(d*sizeF/5)*5);
    out.push({n:t.n,f,f0:f,d,status:'b',added:null}); };
  (lib.base||[]).forEach(add);
  if(!lib.noFloor)(FLOOR_TASKS[r.floor]||[]).forEach(t=>{const t2={...t};if(lib.floorMop7&&t2.n.startsWith('Mop'))t2.f=7;add(t2);});
  lib.equipment.filter(([k])=>r.equip.includes(k)).forEach(([,,,ts])=>ts.forEach(add));
  r.custom.forEach(c=>add({n:`Clean ${c.name.toLowerCase()}`,f:30,d:15}));
  if(r.windows&&r.windows!=='0'){
    const w=WINDOWS.find(x=>x[0]===r.windows);
    add({n:'Clean windows inside',f:60,d:w[2]});
    if(lib.windowsCurtains) add({n:'Wash curtains / dust blinds',f:120,d:20});
  }
  r.tasks=out;
}
function rTasks(){
  const r=state.rooms[state.cur];
  title.textContent=`${r.name} · tasks`;
  const t=r.tasks[state.ti];
  const decided=r.tasks.slice(0,state.ti).filter(x=>x.added);
  const compactRows=decided.map(x=>`<div class="done-row task"><span class="st ${x.status}">${ST_ICON[x.status]}</span><span class="v">${x.n}<small>${fmtFreq(x.f)} · ~${x.d}m</small></span><span class="edit">${CHECKSVG}</span></div>`).join('');
  if(!t){ rOwnTask(compactRows); return; }
  scr.innerHTML=`
    ${compactRows}
    <div class="q">
      <div class="tname">${t.n}</div>
      <div class="test">takes about ${t.d} min · ${state.ti+1} of ${r.tasks.length} suggestions</div>
      <div class="flabel">How often?</div>
      <div class="freq"><button onclick="stepFreq(-1)">−</button>
        <div class="fv">${fmtFreq(t.f)}${t.f!==t.f0?`<span class="chg">suggested ${fmtFreq(t.f0)}</span>`:'<small>suggested</small>'}</div>
        <button onclick="stepFreq(1)">+</button></div>
      <div class="flabel">State right now</div>
      <div class="gbu">
        <button class="g ${t.status==='g'?'on':''}" onclick="setStat('g')"><span class="em">${I_SPARK}</span>Fresh</button>
        <button class="b ${t.status==='b'?'on':''}" onclick="setStat('b')"><span class="em">${I_HALF}</span>Due soon</button>
        <button class="u ${t.status==='u'?'on':''}" onclick="setStat('u')"><span class="em">${I_ALERT}</span>Overdue</button>
      </div>
      <div class="pair">
        <button class="ghost" onclick="decide(false)">Skip</button>
        <button class="solid" onclick="decide(true)">Add task</button>
      </div>
    </div>`;
}
function stepFreq(dir){ const t=state.rooms[state.cur].tasks[state.ti];
  let fi=FREQ_STEPS.indexOf(t.f); if(fi<0)fi=FREQ_STEPS.findIndex(s=>s>=t.f);
  t.f=FREQ_STEPS[Math.min(FREQ_STEPS.length-1,Math.max(0,fi+dir))]; render(); }
function setStat(s){ state.rooms[state.cur].tasks[state.ti].status=s; render(); }
function decide(add){ state.rooms[state.cur].tasks[state.ti].added=add; state.ti++; render(); }

function rOwnTask(compactRows){
  const r=state.rooms[state.cur];
  scr.innerHTML=`
    ${compactRows}
    <div class="q">
      <h3>Your own task for ${r.name}?</h3>
      <p class="sub" style="margin-bottom:10px">Anything the suggestions missed.</p>
      <input class="tin" id="ownName" placeholder="Task name…">
      <div class="flabel">How often?</div>
      <div class="freq"><button onclick="ownFreq(-1)">−</button><div class="fv" id="ownF">${fmtFreq(state.ownF)}</div><button onclick="ownFreq(1)">+</button></div>
      <div class="pair"><button class="solid" onclick="addOwn()">Add this task</button></div>
    </div>
    <button class="cta" onclick="roomDone()">Done with ${r.name} →</button>`;
}
function ownFreq(dir){ let fi=FREQ_STEPS.indexOf(state.ownF); fi=Math.min(FREQ_STEPS.length-1,Math.max(0,fi+dir));
  state.ownF=FREQ_STEPS[fi]; document.getElementById('ownF').textContent=fmtFreq(state.ownF); }
function addOwn(){
  const nm=document.getElementById('ownName').value.trim(); if(!nm)return;
  state.rooms[state.cur].tasks.push({n:nm,f:state.ownF,f0:state.ownF,d:10,status:'b',added:true});
  state.ownF=7; render();
}
function roomDone(){
  state.cur++;
  if(state.cur<state.rooms.length){ state.cfgStep=0; state.ti=0; state.history=[]; go('config',false); }
  else { state.history=[]; go('overview',false); }
}

// ============ overview ======================================================
function rOverview(){
  title.textContent='Your home';
  scr.innerHTML=`
    <h2>Everything correct?</h2>
    <p class="sub">Tap a room to review — this screen lives behind the ⚙︎ button later, so nothing is final.</p>
    ${state.rooms.map((r,i)=>{
      const added=r.tasks.filter(t=>t.added);
      const setline=[SIZES.find(x=>x[0]===r.size)?.[1],WINDOWS.find(x=>x[0]===r.windows)?.[1],LIB[r.type].noFloor?null:FLOORS.find(x=>x[0]===r.floor)?.[1]].filter(Boolean).join(' · ');
      return `<div class="ovroom" id="ov${i}">
        <div class="hd" onclick="document.getElementById('ov${i}').classList.toggle('exp')">
          <span class="ric">${ico(r.type)}</span><span class="nm">${r.name}</span><span class="n">${added.length} tasks ▾</span>
        </div>
        <div class="set" onclick="editRoom(${i})"><u>${setline}</u> · edit</div>
        <div class="ovtasks">${added.map(t=>`<div><b>${t.n}</b><span>${fmtFreq(t.f)}</span></div>`).join('')}</div>
      </div>`;}).join('')}
    <button class="cta ghost" onclick="go('roomselect')">+ Add or remove rooms</button>
    <button class="cta" onclick="go('done',false)">Build my home</button>`;
}
function editRoom(i){ state.cur=i; state.cfgStep=0; go('config'); }

// ============ done ==========================================================
const X0=6.5,XR=197.25,AXIS_D=Math.log(15)/0.9;
const axisFrac=x=>x<=0?0:Math.min(1,Math.log(1+x)/AXIS_D);
const axisX=f=>X0+f*(XR-X0);
function hornPath(c){const H=13,k=1.5,cy=10,R=H/2,N=46;const xE=axisX(axisFrac(c));
const h=x=>H*Math.exp(-k*(x-X0)/(XR-X0));const rr=Math.max(1.1,h(xE)/2),xB=xE-rr;
const xs=Array.from({length:N+1},(_,i)=>X0+(xB-X0)*(i/N));
let p=`M ${X0} ${(cy-H/2).toFixed(2)}`;for(const x of xs)p+=` L ${x.toFixed(1)} ${(cy-h(x)/2).toFixed(2)}`;
p+=` A ${rr.toFixed(2)} ${rr.toFixed(2)} 0 0 1 ${xB.toFixed(1)} ${(cy+h(xB)/2).toFixed(2)}`;
for(let i=xs.length-1;i>=0;i--)p+=` L ${xs[i].toFixed(1)} ${(cy+h(xs[i])/2).toFixed(2)}`;
p+=` A ${R} ${R} 0 0 1 ${X0} ${(cy-H/2).toFixed(2)} Z`;return p;}
const GREEN=[94,160,46],YELLOW=[224,165,0],RED=[226,75,74];
const hx=c=>'#'+c.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
const mx=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const STATUS_PD={g:5,b:70,u:130};
function rDone(){
  title.textContent='Welcome home';
  const all=[];
  state.rooms.forEach(r=>r.tasks.filter(t=>t.added).forEach((t,i)=>{
    const pd=Math.max(0,STATUS_PD[t.status]+((i*37)%21-10));
    all.push({...t,room:r.name,pd,dueIn:t.f*(1-pd/100)});
  }));
  all.sort((a,b)=>a.dueIn-b.dueIn);
  const fmt=x=>x<-0.5?`${Math.round(-x)}d over`:x<0.5?'Today':`${Math.round(x)}d`;
  scr.innerHTML=`
    <h2>Home built</h2>
    <p class="sub">${state.rooms.length} rooms · ${all.length} tasks. Day one, already honest:</p>
    <div class="axis"><span>today</span>${[[1,'1d'],[3,'3d'],[7,'1w'],[14,'2w']].map(([d,l])=>`<span style="left:${axisX(axisFrac(d))/200*100}%">${l}</span>`).join('')}</div>
    ${all.slice(0,14).map((t,idx)=>{
      const fill=t.pd>=100?hx(RED):hx(mx(GREEN,YELLOW,t.pd/100));
      const stroke=hx(mx(t.pd>=100?RED:mx(GREEN,YELLOW,t.pd/100),[0,0,0],.22));
      const sx=axisX(axisFrac(Math.max(0,t.dueIn)));
      const dc=t.pd>=100?'#dc2626':t.pd>=75?'#d97706':'var(--muted)';
      const path=hornPath(t.f);
      return `<div class="ptile">
        <div class="r1"><span class="n">${t.n}<small>${t.room}</small></span><span class="d" style="color:${dc}">${fmt(t.dueIn)}</span></div>
        <svg class="bar" viewBox="0 0 200 20">
          <defs><clipPath id="d${idx}"><rect x="${sx}" y="0" width="200" height="20"/></clipPath></defs>
          <path d="${path}" fill="${fill}" clip-path="url(#d${idx})"/>
          <path d="${path}" fill="none" stroke="${stroke}" stroke-width="0.7"/>
        </svg></div>`;}).join('')}
    ${all.length>14?`<p class="sub" style="text-align:center">… and ${all.length-14} more</p>`:''}
    <div class="gearnote"><span style="font-size:17px">⚙︎</span><span>The <b>gear button</b> in the app header brings you back to the home overview — change rooms, tasks, frequencies, anything, anytime.</span></div>`;
}

render();
</script>
